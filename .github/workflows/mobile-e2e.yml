name: Mobile E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mobile-e2e-test:
    name: Mobile E2E Test Suite (Detox & Maestro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: npm ci
        working-directory: mobile

      - name: Validate E2E Test Files & Flows
        run: ./scripts/run-mobile-e2e.sh

      - name: Run E2E Test Specs
        run: npm run test:e2e
        working-directory: mobile
